<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="LoopEva builds the connection between robot capability, real-world deployment, and continuous improvement." />
    <title>LoopEva — Robotics in a loop</title>
    <link rel="icon" type="image/png" href="assets/loopeva-mark.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="index.html" aria-label="LoopEva home">
          <img class="brand-icon" src="assets/loopeva-mark.png" alt="" width="836" height="770" />
          <img class="brand-wordmark" src="assets/loopeva-wordmark.png" alt="LoopEva" width="808" height="158" />
        </a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
        <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
          <a href="#news">News</a>
          <a href="blog/">Blog</a>
          <a href="research/">Research</a>
          <a href="contact/">Contact</a>
        </nav>
      </div>
    </header>

    <main class="page-shell">
      <section class="hero" aria-labelledby="hero-title">
        <div>
          <div class="eyebrow">LoopEva / 001</div>
          <h1 id="hero-title">Robotics<br /><span>in a loop.</span></h1>
          <p class="hero-lede">We are building the connection between robot capability, real-world deployment, and continuous improvement.</p>
        </div>
        <div class="hero-visual" aria-hidden="true">
          <div class="hero-emblem">
            <img class="hero-mark" src="assets/loopeva-mark.png" alt="" width="836" height="770" />
            <span class="hero-corner hero-corner-top">Learning</span>
            <span class="hero-corner hero-corner-left">Capability</span>
            <span class="hero-corner hero-corner-right">Deployment</span>
          </div>
          <img class="hero-wordmark" src="assets/loopeva-wordmark.png" alt="" width="808" height="158" />
        </div>
      </section>

      <section class="release-feed" id="news" aria-label="Latest releases">
        <!-- Keep releases in reverse chronological order: newest first.
             Replace the placeholder with the approved video and introduction when ready. -->
        <article class="release-card" aria-labelledby="loopwam-release-title">
          <div class="release-media release-placeholder">
            <div>
              <h2 id="loopwam-release-title">LoopWAM</h2>
              <p class="release-status">Coming soon</p>
            </div>
          </div>
        </article>
      </section>
    </main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <p class="footer-mark">LoopEva</p>
        <p>© <span data-year>2026</span> LoopEva</p>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
